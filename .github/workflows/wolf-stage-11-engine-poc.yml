name: WOLF stage 11 isolated engine POCs

on:
  pull_request:
    branches:
      - docs/stage-07-cinematic-asset-inventory
    paths:
      - "engine-pocs/**"
      - "docs/WOLF_STAGE_11_ENGINE_COMPATIBILITY_POC.md"
      - ".github/workflows/wolf-stage-11-engine-poc.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wolf-stage-11-engine-poc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-engine-pocs:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'feature/stage-11-engine-compatibility-poc'
    name: Isolated Android engine runtime POCs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out isolated POC branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable and verify KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test "$(uname -m)" = "x86_64"
          test -c /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "8.13"
          cache-provider: basic

      - name: Build isolated Android POC variants and resolve SceneView
        run: |
          gradle --no-daemon -p engine-pocs/android \
            :app:assembleGodotDebug \
            :app:assembleFilamentDebug \
            :app:assembleLibgdxDebug \
            :app:assembleLottieDebug \
            :app:dependencies --configuration sceneViewPoc

      - name: Run each engine test separately on Android 12
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim -no-metrics
          disable-linux-hw-accel: false
          disable-animations: true
          script: gradle --no-daemon -p engine-pocs/android :app:connectedGodotDebugAndroidTest :app:connectedFilamentDebugAndroidTest :app:connectedLibgdxDebugAndroidTest :app:connectedLottieDebugAndroidTest

  korge-android-poc:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'feature/stage-11-engine-compatibility-poc'
    name: KorGE isolated Android packaging POC
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out isolated POC branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21 for KorGE 6.0.0 plugin runtime
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "8.13"
          cache-provider: basic

      - name: Build KorGE Android APK and AAB
        run: gradle --no-daemon -p engine-pocs/korge assembleDebug packageAndroidDebug
