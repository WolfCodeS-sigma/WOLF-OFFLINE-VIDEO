name: Phase 17 Android runtime validation

on:
  pull_request:
    branches:
      - feature/phase-16-offline-runtime-closure
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

concurrency:
  group: phase-17-android-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-runtime:
    name: Build APK and launch on offline Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out Phase 17 test branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0 emulator system-images;android-35;google_apis;x86_64

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build APK and rerun Phase 16 quality gates
        run: gradle --no-daemon :app:verifyOfflineRuntime lintDebug testDebugUnitTest :app:assembleDebug

      - name: Install and launch with emulator networking disabled
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          disable-linux-hw-accel: true
          emulator-boot-timeout: 900
          script: |
            set -euo pipefail
            APK="app/build/outputs/apk/debug/app-debug.apk"
            test -s "$APK"
            adb install -r "$APK"
            adb shell svc wifi disable
            adb shell svc data disable
            adb shell settings put global airplane_mode_on 1
            adb shell am broadcast -a android.intent.action.AIRPLANE_MODE --ez state true
            test "$(adb shell settings get global airplane_mode_on | tr -d '\r')" = "1"
            test "$(adb shell settings get global wifi_on | tr -d '\r')" = "0"
            adb shell am force-stop com.wolfcodes.offline
            adb shell am start -W -n com.wolfcodes.offline/.MainActivity
            for attempt in $(seq 1 30); do
              if adb shell pidof com.wolfcodes.offline >/dev/null 2>&1; then
                break
              fi
              sleep 1
            done
            adb shell pidof com.wolfcodes.offline
            for attempt in $(seq 1 30); do
              adb shell uiautomator dump /sdcard/wolf-window.xml >/dev/null 2>&1 || true
              adb pull /sdcard/wolf-window.xml wolf-window.xml >/dev/null 2>&1 || true
              if test -s wolf-window.xml && grep -q "WOLF OFFLINE VIDEO" wolf-window.xml; then
                break
              fi
              sleep 1
            done
            test -s wolf-window.xml
            grep -q "WOLF OFFLINE VIDEO" wolf-window.xml
            adb shell screencap -p /sdcard/wolf-phase17.png
            adb pull /sdcard/wolf-phase17.png wolf-phase17.png
            test -s wolf-phase17.png

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wolf-offline-video-phase17-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload successful emulator evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wolf-offline-video-phase17-emulator-evidence
          path: |
            wolf-window.xml
            wolf-phase17.png
          if-no-files-found: error
          retention-days: 30
