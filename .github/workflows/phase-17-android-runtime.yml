name: Phase 17 Android runtime validation

on:
  pull_request:
    branches:
      - feature/phase-16-offline-runtime-closure
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

concurrency:
  group: phase-17-android-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-runtime:
    name: Build APK and launch on offline Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out Phase 17 test branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0 emulator system-images;android-35;google_apis;x86_64

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build APK and rerun Phase 16 quality gates
        run: gradle --no-daemon :app:verifyOfflineRuntime lintDebug testDebugUnitTest :app:assembleDebug

      - name: Verify APK output before emulator startup
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: Install and launch with emulator networking disabled
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          disable-linux-hw-accel: true
          emulator-boot-timeout: 1800
          working-directory: ${{ github.workspace }}
          script: bash "$GITHUB_WORKSPACE/.github/scripts/phase-17-android-runtime-smoke.sh"

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wolf-offline-video-phase17-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload successful emulator evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wolf-offline-video-phase17-emulator-evidence
          path: |
            wolf-window.xml
            wolf-phase17.png
          if-no-files-found: error
          retention-days: 30
