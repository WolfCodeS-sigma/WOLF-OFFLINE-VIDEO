name: Phase 17 Android runtime validation

on:
  pull_request:
    branches:
      - main
      - recovery/**
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

concurrency:
  group: phase-17-android-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-runtime:
    name: Build APK and launch on offline Android 12 emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out Phase 17 test branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0 emulator system-images;android-31;google_apis;x86_64

      - name: Enable KVM acceleration for the Android emulator
        run: |
          set -euo pipefail
          if [[ ! -c /dev/kvm ]]; then
            echo "This runner does not expose the KVM device required for stable x86_64 emulator acceleration." >&2
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          ls -l /dev/kvm

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "8.13"
          cache-provider: basic

      - name: Build APK and rerun Phase 16 quality gates
        run: gradle --no-daemon :app:verifyOfflineRuntime lintDebug testDebugUnitTest :app:assembleDebug

      - name: Verify APK output before emulator startup
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: Install and launch with Android 12 networking disabled
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -accel on -memory 4096
          emulator-boot-timeout: 1800
          working-directory: ${{ github.workspace }}
          script: bash "$GITHUB_WORKSPACE/.github/scripts/phase-17-android-runtime-smoke.sh"

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wolf-offline-video-phase17-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload successful emulator evidence
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wolf-offline-video-phase17-emulator-evidence
          path: |
            wolf-window.xml
            wolf-phase17.png
          if-no-files-found: error
          retention-days: 30
