name: WOLF Stage 13 full audit and regression suite

on:
  push:
    branches:
      - design/stage-13-motion-code-library-scene-contract
    paths:
      - "app/src/**"
      - "app/build.gradle.kts"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "engine-pocs/**"
      - "asset-intake/**"
      - "tools/asset-intake/**"
      - "docs/WOLF_STAGE_11_ENGINE_COMPATIBILITY_POC.md"
      - "docs/WOLF_STAGE_12_FINAL_ENGINE_ROLES_AR.md"
      - "docs/WOLF_STAGE_13_MOTION_CODE_LIBRARY_SCENE_CONTRACT.md"
      - ".github/workflows/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wolf-stage-13-full-regression-${{ github.ref }}
  queue: max

jobs:
  app-quality:
    name: Build Debug APK, lint and all JVM tests (stages 01-13)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out stage 13 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "8.13"
          cache-provider: basic

      - name: Build Debug APK and run lint plus all JVM regression tests
        run: gradle --no-daemon :app:assembleDebug lintDebug testDebugUnitTest

      - name: Verify Filament ARM64 native library is packaged
        shell: bash
        run: |
          set -euo pipefail
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -F "lib/arm64-v8a/libfilament-jni.so"

  app-android-regression:
    name: Android 12 app integration regression (media, audio, checkpoints, assets)
    needs: app-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out stage 13 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable and verify KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test "$(uname -m)" = "x86_64"
          test -c /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "8.13"
          cache-provider: basic

      - name: Run app instrumentation tests on Android 12
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim -no-metrics
          disable-linux-hw-accel: false
          disable-animations: true
          script: gradle --no-daemon :app:connectedDebugAndroidTest

  stage-11-engine-regression:
    name: Stage 11 isolated Godot, Filament, libGDX and Lottie regressions
    needs: [app-android-regression, korge-regression, asset-intake-regression]
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Check out stage 13 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable and verify KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test "$(uname -m)" = "x86_64"
          test -c /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "8.13"
          cache-provider: basic

      - name: Build isolated Android engine POC variants and resolve SceneView
        run: |
          gradle --no-daemon --max-workers=2 -p engine-pocs/android \
            :app:assembleGodotDebug \
            :app:assembleFilamentDebug \
            :app:assembleLibgdxDebug \
            :app:assembleLottieDebug \
            :app:dependencies --configuration sceneViewPoc

      - name: Run isolated engine POC tests on Android 12
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -no-metrics
          disable-linux-hw-accel: false
          disable-animations: true
          script: bash engine-pocs/android/scripts/run-engine-android-regressions.sh

  korge-regression:
    name: KorGE Android packaging regression
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out stage 13 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21 for KorGE 6.0.0 plugin runtime
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "8.13"
          cache-provider: basic

      - name: Build KorGE Android APK and AAB without publishing artifacts
        run: gradle --no-daemon -p engine-pocs/korge assembleDebug packageAndroidDebug

  asset-intake-regression:
    name: Previous asset intake and integrity regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out stage 13 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run asset intake validator tests and baseline manifest
        run: |
          python3 --version
          python3 -m unittest discover -s tools/asset-intake/tests -v
          python3 tools/asset-intake/wolf_asset_intake.py --manifest asset-intake/batches/000-baseline/manifest.json --repo-root .

      - name: Confirm candidate leads are never promoted automatically
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          leads = json.loads(Path('asset-intake/leads/source-leads.json').read_text())
          registry = json.loads(Path('app/src/main/assets/wolf_asset_registry.json').read_text())
          assert registry['assets'] == [], 'Candidate assets must never be promoted automatically'
          assert all(x['status'] in {'DISCOVERED_NOT_ACQUIRED', 'ACQUIRED_CANDIDATE'} for x in leads['leads'])
          print(f"Validated {len(leads['leads'])} source leads; production registry remains empty")
          PY
