name: WOLF Stage 13 motion library and scene contract

on:
  push:
    branches:
      - design/stage-13-motion-code-library-scene-contract
    paths:
      - "app/src/main/java/com/wolfcodes/offline/WolfMotionCodeLibrary.kt"
      - "app/src/main/java/com/wolfcodes/offline/WolfSceneContract.kt"
      - "app/src/test/java/com/wolfcodes/offline/WolfMotionCodeLibraryTest.kt"
      - "app/src/test/java/com/wolfcodes/offline/WolfSceneContractTest.kt"
      - "app/build.gradle.kts"
      - ".github/workflows/wolf-stage-13-motion-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wolf-stage-13-motion-contract-stage-13
  cancel-in-progress: true

jobs:
  stage-13-quality:
    name: Android lint and JVM contract tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out stage 13 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "8.13"
          cache-provider: basic

      - name: Run Android lint and all JVM unit tests
        run: gradle --no-daemon lintDebug testDebugUnitTest
