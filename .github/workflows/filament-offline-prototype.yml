name: Filament Android Native prototype

on:
  pull_request:
    branches:
      - feature/stage-11-engine-compatibility-poc
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: filament-native-prototype-${{ github.ref }}
  queue: max

jobs:
  android-build:
    name: Debug APK, lint and JVM unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out prototype branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle through the checked-in wrapper
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      - name: Compilation and dependency check
        run: ./gradlew assembleDebug --stacktrace

      - name: Static lint check
        run: ./gradlew lintDebug

      - name: Verify Filament ARM64 native library in APK
        shell: bash
        run: |
          set -o pipefail
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep "lib/arm64-v8a/libfilament-jni.so"

      - name: Run JVM unit tests
        run: ./gradlew testDebugUnitTest

  android-emulator:
    name: Five-second Filament UI export and Android regression tests
    needs: android-build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out prototype branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable and verify KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test "$(uname -m)" = "x86_64"
          test -c /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle through the checked-in wrapper
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      - name: Run Android 12 regression and Filament MP4 export tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim -no-metrics
          disable-linux-hw-accel: false
          disable-animations: true
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest
