name: Offline quality checks

on:
  push:
    branches:
      - main
      - 'development/**'
      - 'feature/**'
  pull_request:
    branches:
      - main
      - 'development/**'
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-quality:
    name: Offline contract, Android lint and JVM unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "8.13"
          cache-provider: basic

      - name: Verify offline runtime contract, Android lint and local unit tests
        run: gradle --no-daemon :app:verifyOfflineRuntime lintDebug testDebugUnitTest
